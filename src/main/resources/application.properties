# ============================================================
# Configuracion global (compartida por todos los perfiles)
# No incluir aqui secrets ni URLs de BD — van en cada perfil
# ============================================================

spring.application.name=barrio-alerta

# Perfil por defecto (desarrollo local)
spring.profiles.active=dev

# JPA / Hibernate (compartido)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Multipart (subida de fotos de mascotas)
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Directorio de uploads (mapeado a volumen Docker en producción)
app.uploads.dir=${APP_UPLOADS_DIR:uploads}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs

# Jackson timezone
spring.jackson.time-zone=America/Bogota

# Brevo: todo viene del entorno, nunca del repo. En prod es obligatorio
# (application-prod.properties lo exige sin valor por defecto).
brevo.api-key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:}
brevo.sender.name=${BREVO_SENDER_NAME:Alerta Barrio APP}
