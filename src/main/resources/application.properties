# ============================================================
# Configuracion global (compartida por todos los perfiles)
# No incluir aqui secrets ni URLs de BD — van en cada perfil
# ============================================================

spring.application.name=barrio-alerta

# Perfil por defecto (desarrollo local)
spring.profiles.active=dev

# JPA / Hibernate (compartido)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs

# Jackson timezone
spring.jackson.time-zone=America/Bogota

# Brevo (placeholders — los valores reales van en application-local.properties)
brevo.api.key=${BREVO_API_KEY:changeme}
brevo.sender.email=${BREVO_SENDER_EMAIL:changeme@localhost}
brevo.sender.name=${BREVO_SENDER_NAME:Alerta Barrio}