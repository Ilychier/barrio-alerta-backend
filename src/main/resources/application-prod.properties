# ============================================================
# Perfil prod - Base de datos PostgreSQL (Docker Compose)
# El hostname "database" es el nombre del servicio en
# docker-compose.local.yml / docker-compose.production.yml
# ============================================================

spring.datasource.url=jdbc:postgresql://database:5432/${POSTGRES_DB:alerta_barrio}
spring.datasource.username=${DB_USER:alerta_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# Secretos: obligatorios en prod. Sin el valor en el entorno, el
# arranque falla (no hay default, a proposito).
# ============================================================
brevo.api-key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME}
jwt.secret=${JWT_SECRET}
