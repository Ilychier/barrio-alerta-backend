# ============================================================
# Docker Compose — Barrio Alerta Backend
#
# Uso en desarrollo (solo BD):
#   docker compose up db -d
#
# Uso en produccion (BD + App):
#   docker compose up -d
#
# Tirar todo:
#   docker compose down
# ============================================================

services:
  # Base de datos — se usa tanto en dev como en prod
  db:
    image: postgres:16-alpine
    container_name: alerta-barrio-db
    environment:
      POSTGRES_DB: alerta_barrio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alerta_barrio"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Aplicacion — solo se levanta en produccion
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alerta-barrio-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_USER=postgres
      - DB_PASSWORD=1234
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: